<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>通讯录 · Address Book</title>
  <meta name="description" content="支持收藏、多联系方式与 Excel 导入导出的纯前端通讯录" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b63f6'/%3E%3Cpath d='M10 9h9a3 3 0 0 1 3 3v11H13a3 3 0 0 1-3-3z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M10 20h12' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 图标精灵：所有图标通过 <use> 复用，避免重复内联 -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M20 20l-3.4-3.4" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4" /><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4" /><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.62 5.3 5.85.85-4.23 4.13 1 5.83L12 16.96l-5.24 2.75 1-5.83L3.53 9.75l5.85-.85z" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7.5 18.5 3.5 19.5l1-4z" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16" /><path d="M9.5 7V5h5v2" /><path d="M6.5 7l.9 12a2 2 0 0 0 2 1.9h5.2a2 2 0 0 0 2-1.9l.9-12" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5" /><path d="M5 15V6a2 2 0 0 1 2-2h8" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" /><circle cx="9" cy="10.5" r="2" /><path d="M6 16.2c.75-1.5 1.8-2.25 3-2.25s2.25.75 3 2.25" /><path d="M15 9.5h3.2M15 12.5h3.2M15 15.5h2.2" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
    </defs>
  </svg>

  <div class="app" id="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><svg class="icon"><use href="#i-book"></use></svg></span>
        <span class="brand-name">通讯录<em>Address Book</em></span>
      </div>

      <label class="search" for="searchInput">
        <svg class="icon search-icon"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" placeholder="搜索姓名、公司、电话、邮箱…" autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </label>

      <div class="topbar-actions">
        <button class="btn" id="btnImport" type="button">
          <svg class="icon"><use href="#i-import"></use></svg><span>导入</span>
        </button>
        <button class="btn" id="btnExport" type="button">
          <svg class="icon"><use href="#i-export"></use></svg><span>导出</span>
        </button>
        <button class="btn btn-primary" id="btnNew" type="button">
          <svg class="icon"><use href="#i-plus"></use></svg><span>新建联系人</span>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="tabs" role="tablist" aria-label="联系人筛选">
          <button class="tab is-active" type="button" data-filter="all" role="tab" aria-selected="true">
            全部<span id="countAll">0</span>
          </button>
          <button class="tab" type="button" data-filter="starred" role="tab" aria-selected="false">
            收藏<span id="countStarred">0</span>
          </button>
        </div>
        <ul class="contact-list" id="contactList"></ul>
        <footer class="sidebar-foot">
          <span id="statText">共 0 位联系人</span>
          <span class="foot-actions">
            <button class="link-btn" id="btnDemo" type="button">载入示例</button>
            <button class="link-btn is-danger" id="btnClear" type="button">清空</button>
          </span>
        </footer>
      </aside>

      <section class="detail" id="detail"></section>
    </main>
  </div>

  <!-- 导入预览 -->
  <div class="mask" id="importMask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <header class="modal-head">
        <h3 id="importTitle">导入 Excel 通讯录</h3>
        <button class="btn-icon" type="button" data-close="importMask" aria-label="关闭">
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="modal-body" id="importBody"></div>
      <footer class="modal-foot">
        <button class="btn" id="btnTemplate" type="button">下载导入模板</button>
        <span class="spacer"></span>
        <button class="btn" type="button" data-close="importMask">取消</button>
        <button class="btn btn-primary" id="btnConfirmImport" type="button" disabled>确认导入</button>
      </footer>
    </div>
  </div>

  <!-- 通用确认框 -->
  <div class="mask" id="confirmMask" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <header class="modal-head">
        <h3 id="confirmTitle">确认操作</h3>
        <button class="btn-icon" type="button" data-close="confirmMask" aria-label="关闭">
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="modal-body">
        <p class="confirm-text" id="confirmText">该操作不可撤销，是否继续？</p>
      </div>
      <footer class="modal-foot">
        <span class="spacer"></span>
        <button class="btn" type="button" data-close="confirmMask">取消</button>
        <button class="btn btn-danger" id="btnConfirmOk" type="button">确认</button>
      </footer>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden />

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
